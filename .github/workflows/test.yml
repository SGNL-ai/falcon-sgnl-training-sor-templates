name: PR Notifications

on:
  pull_request:
    types: [opened]
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        run: |
          git clone --depth=50 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .
          git fetch origin main:refs/remotes/origin/main
          git checkout "${{ github.event.pull_request.head.sha }}"

      - name: Generate changelog
        id: changelog
        run: |
          COMMITS=$(git log --pretty=format:"• %s (%an)" origin/main..HEAD 2>/dev/null || echo "• No commits found")
          FILES=$(git diff --stat origin/main..HEAD 2>/dev/null || echo "No file diff available")
          echo "commits<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_BRANCH: ${{ github.head_ref }}
          COMMITS: ${{ steps.changelog.outputs.commits }}
          FILES: ${{ steps.changelog.outputs.files }}
        run: |
          # Build the payload using jq to handle special characters safely
          PAYLOAD=$(jq -n \
            --arg title "📋 New Pull Request - falcon-sgnl-training-sor-templates" \
            --arg pr_info "*PR:* <${PR_URL}|#${PR_NUMBER} - ${PR_TITLE}>" \
            --arg author "$PR_AUTHOR" \
            --arg branch "${HEAD_BRANCH} → main" \
            --arg commits "$COMMITS" \
            --arg files "$FILES" \
            --arg pr_url "$PR_URL" \
            '{
              "text": "New PR opened in falcon-sgnl-training-sor-templates",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": $title }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": ("*Author:*\n" + $author) },
                    { "type": "mrkdwn", "text": ("*Branch:*\n" + $branch) }
                  ]
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": $pr_info }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": ("*Commits:*\n" + $commits) }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": ("*Changed files:*\n```" + $files + "```") }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Review PR" },
                      "url": $pr_url
                    }
                  ]
                }
              ]
            }')

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Send email notification
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_BRANCH: ${{ github.head_ref }}
          COMMITS: ${{ steps.changelog.outputs.commits }}
          FILES: ${{ steps.changelog.outputs.files }}
        run: |
          SUBJECT="📋 New PR #${PR_NUMBER} - ${PR_TITLE}"

          BODY=$(cat <<HTMLEOF
          <h2>New Pull Request - falcon-sgnl-training-sor-templates</h2>
          <p><strong>PR:</strong> <a href="${PR_URL}">#${PR_NUMBER} - ${PR_TITLE}</a></p>
          <p><strong>Author:</strong> ${PR_AUTHOR}</p>
          <p><strong>Branch:</strong> ${HEAD_BRANCH} → main</p>
          <h3>Commits:</h3>
          <pre>${COMMITS}</pre>
          <h3>Changed files:</h3>
          <pre>${FILES}</pre>
          <p><a href="${PR_URL}">Review PR</a></p>
          HTMLEOF
          )

          # Send via SMTP using curl
          cat > /tmp/email.txt <<EMAILEOF
          From: Deploy Bot <${EMAIL_USERNAME}>
          To: joe.welsh@crowdstrike.com
          Subject: ${SUBJECT}
          MIME-Version: 1.0
          Content-Type: text/html; charset="UTF-8"

          ${BODY}
          EMAILEOF

          curl -s --ssl-reqd \
            --url "smtps://smtp.gmail.com:465" \
            --user "${EMAIL_USERNAME}:${EMAIL_PASSWORD}" \
            --mail-from "${EMAIL_USERNAME}" \
            --mail-rcpt "joe.welsh@crowdstrike.com" \
            --upload-file /tmp/email.txt
